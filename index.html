<style>

    --ink: #20242a;
    --muted: #676f72;
    --line: #d7dcda;
    --patina: #234b46;
    --patina-dim: #3e6862;
    --rust: #20242a;
    --rust-dim: #454c52;
    --focus: #3b5ba9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c2023;
      --paper-raised: #262b2f;
      --ink: #eceeec;
      --muted: #9aa2a6;
      --line: #3b4145;
      --patina: #7fc2b4;
      --patina-dim: #5c8e83;
      --rust: #eceeec;
      --rust-dim: #b6bcc0;
      --focus: #7f9bdc;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c2023;
    --paper-raised: #262b2f;
    --ink: #eceeec;
    --muted: #9aa2a6;
    --line: #3b4145;
    --patina: #7fc2b4;
    --patina-dim: #5c8e83;
    --rust: #eceeec;
    --rust-dim: #b6bcc0;
    --focus: #7f9bdc;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    touch-action: manipulation;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .app {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 20px 20px max(20px, env(safe-area-inset-bottom));

    align-items: center;
    justify-content: space-between;

    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .progress-track {

    height: 7px;
    border-radius: 999px;
    margin: 0 12px;
    overflow: hidden;
    position: relative;

  .progress-fill {
    position: absolute;
    top: 0; right: 0;
    height: 100%;
    background: var(--paper);
    transition: width 0.4s ease;
  }
  .progress-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 26px;
    animation: fade 0.35s ease;
  }

  .kicker {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  h1.screen-title {
    font-size: clamp(24px, 6vw, 30px);
    font-weight: 600;
    margin-bottom: 6px;

  .address {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    color: var(--muted);
    background: var(--paper);
    border: 1px dashed var(--line);

  }

  .desc {

  .greeting {

    margin: 16px 0 6px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 4px 14px;
    background: var(--paper);
  }
  details.politik summary {
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--patina-dim);
    padding: 10px 0;
    list-style: none;
  }
  details.politik summary::-webkit-details-marker { display: none; }
  details.politik summary::before {
    content: "▸ ";
  }
  details.politik[open] summary::before {
    content: "▾ ";
  }
  .politik-question {
    font-style: italic;
    font-size: 14.5px;
    color: var(--muted);
    margin: 2px 0 12px;
  }
  .politik-summary {
    font-size: 14.5px;
    margin: 0 0 14px;
    padding: 8px 10px;
    background: var(--paper-raised);
    border-left: 3px solid var(--patina-dim);

  }
  .politik-answer {

    margin: 0 0 12px;
  }
  .politik-answer:last-child { margin-bottom: 8px; }
  .politik-answer .party {

  }

  .btn-row {
    margin-top: auto;
    padding-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px 20px;
    border-radius: 12px;
    border: none;
    font-family: "Source Sans 3", sans-serif;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--rust); color: var(--paper-raised); }
  .btn-primary:hover { opacity: 0.92; }
  .btn-walk { background: var(--patina); color: var(--paper-raised); }
  .btn-walk:hover { opacity: 0.92; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    font-weight: 400;
    font-size: 14px;
    padding: 10px 10px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .map-links {
    display: flex;
    gap: 10px;
    margin: 4px 0 2px;
  }
  .map-link {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
  }
  .map-link:active { transform: scale(0.98); }

  .stop-list {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--line);
  }
  .dot.done { background: var(--patina); }
  .dot.current { background: var(--rust); }

  footer.tiny {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 14px;
  }

</style>

  // state: { phase: 'welcome'|'walk'|'arrived'|'done', index: 0-based into stops }
  var state = { phase: "welcome", index: 0 };

  try {
    var saved = JSON.parse(localStorage.getItem("rundgang-state") || "null");
    if (saved && typeof saved.index === "number" && saved.phase) state = saved;
  } catch (e) {}

  function save() {
    try { localStorage.setItem("rundgang-state", JSON.stringify(state)); } catch (e) {}
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  }

  function mapsLinks(s) {
    var query = s.mapQuery || s.address;
    var enc = encodeURIComponent(query);
    return {
      google: "https://www.google.com/maps/dir/?api=1&destination=" + enc + "&travelmode=walking",
      apple: "https://maps.apple.com/?daddr=" + enc + "&dirflg=w"
    };
  }

  function renderPolitik(politik) {
    var h = '<details class="politik"><summary>Politik</summary>';
    h += '<p class="politik-question">' + esc(politik.question) + '</p>';
    if (politik.summary) {
      h += '<p class="politik-summary">' + esc(politik.summary) + '</p>';
    }
    for (var i = 0; i < politik.answers.length; i++) {
      var a = politik.answers[i];
      h += '<p class="politik-answer"><span class="party">' + esc(a.party) + ':</span> „' + esc(a.text) + '“</p>';
    }
    h += '</details>';
    return h;
  }

  function render() {
    var card = document.getElementById("card");
    var total = stops.length;
    var doneCount = state.phase === "welcome" ? 0 : state.phase === "done" ? total : state.index + (state.phase === "arrived" ? 1 : 0);
    document.getElementById("progressFill").style.width = (100 - (doneCount / total * 100)) + "%";
    document.getElementById("progressLabel").textContent = (state.phase === "welcome" ? 0 : state.phase === "done" ? total : state.index + 1) + "/" + total;

    var html = "";

    if (state.phase === "welcome") {
      html += '<div class="kicker">Start</div>';
      html += '<h1 class="screen-title">Willkommen beim Rundgang durch St. Georg</h1>';
      html += '<p class="greeting">Sch\u00f6n, dass ihr dabei seid! Dieser Guide begleitet euch zu ' + total + ' Stationen im Stadtteil \u2013 zu Religion, Kunst, Wirtschaft, Sicherheit, Politik und Kultur. Startpunkt ist die Brecht-Schule Hamburg.</p>';
      html += '<div class="btn-row"><button class="btn btn-primary" id="btnGo">Los geht&rsquo;s \u2192</button></div>';
    } else if (state.phase === "walk") {
      var s = stops[state.index];
      html += '<div class="kicker walk">Unterwegs &middot; Station ' + s.nr + ' von ' + total + '</div>';
      html += '<h1 class="screen-title">' + esc(s.title) + '</h1>';
      html += '<div class="address">\ud83d\udccd ' + esc(s.address) + '</div>';
      var links = mapsLinks(s);
      html += '<div class="map-links">';
      html += '<a class="map-link" href="' + links.google + '" target="_blank" rel="noopener">\ud83d\uddfa\ufe0f Google Maps</a>';
      html += '<a class="map-link" href="' + links.apple + '" target="_blank" rel="noopener">\ud83e\udded Apple Karten</a>';
      html += '</div>';
      html += '<p class="desc">Tippt auf einen Link, um die Route zu dieser Adresse zu \u00f6ffnen. Wenn ihr angekommen seid, tippt unten auf weiter.</p>';
      html += '<div class="btn-row">';
      html += '<button class="btn btn-primary" id="btnArrived">Ich bin da \u2192</button>';
      html += '<button class="btn btn-ghost" id="btnBack">\u2190 zur\u00fcck</button>';
      html += '</div>';
    } else if (state.phase === "arrived") {
      var s2 = stops[state.index];
      var isLast = state.index === total - 1;
      html += '<div class="kicker">Station ' + s2.nr + ' von ' + total + '</div>';
      html += '<h1 class="screen-title">' + esc(s2.title) + '</h1>';
      if (s2.desc) {
        for (var d = 0; d < s2.desc.length; d++) {
          html += '<p class="desc">' + esc(s2.desc[d]) + '</p>';
        }
      }
      if (s2.list) {
        html += '<ul class="desc-list">';
        for (var li = 0; li < s2.list.length; li++) {
          html += '<li>' + esc(s2.list[li]) + '</li>';
        }
        html += '</ul>';
      }
      if (s2.politik) {
        html += renderPolitik(s2.politik);
      }
      html += '<div class="btn-row">';
      html += '<button class="btn btn-walk" id="btnNext">' + (isLast ? 'Rundgang beenden \u2713' : 'Weiter zur n\u00e4chsten Station \u2192') + '</button>';
      html += '<button class="btn btn-ghost" id="btnBack">\u2190 zur\u00fcck</button>';
      html += '</div>';
    } else if (state.phase === "done") {
      html += '<div class="kicker">Fertig</div>';
      html += '<h1 class="screen-title">Geschafft! \ud83c\udf89</h1>';
      html += '<p class="greeting">Ihr habt alle ' + total + ' Stationen des Rundgangs durch St. Georg besucht. Danke, dass ihr dabei wart!</p>';
      html += '<div class="btn-row">';
      html += '<button class="btn btn-walk" id="btnRestart">Rundgang neu starten</button>';
      html += '</div>';
    }

    html += '<div class="stop-list">';
    for (var i = 0; i < total; i++) {
      var cls = "dot";
      if (state.phase === "done" || i < state.index || (i === state.index && state.phase === "arrived")) cls += " done";
      if (i === state.index && state.phase !== "done" && state.phase !== "welcome") cls += " current";
      html += '<span class="' + cls + '"></span>';
    }
    html += '</div>';

    card.innerHTML = html;
    wire();
  }

  function wire() {
    var go = document.getElementById("btnGo");
    if (go) go.onclick = function () { state = { phase: "walk", index: 0 }; save(); render(); };

    var arrived = document.getElementById("btnArrived");
    if (arrived) arrived.onclick = function () { state.phase = "arrived"; save(); render(); };

    var next = document.getElementById("btnNext");
    if (next) next.onclick = function () {
      if (state.index < stops.length - 1) { state = { phase: "walk", index: state.index + 1 }; }
      else { state = { phase: "done", index: state.index }; }
      save(); render();
    };

    var back = document.getElementById("btnBack");
    if (back) back.onclick = function () {
      if (state.phase === "arrived") { state.phase = "walk"; }
      else if (state.phase === "walk" && state.index > 0) { state = { phase: "arrived", index: state.index - 1 }; }
      else if (state.phase === "walk" && state.index === 0) { state = { phase: "welcome", index: 0 }; }
      save(); render();
    };

    var restart = document.getElementById("btnRestart");
    if (restart) restart.onclick = function () { state = { phase: "welcome", index: 0 }; save(); render(); };

  }

  render();
